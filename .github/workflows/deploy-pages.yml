# Builds the static site on every push to main and publishes it to the
# gh-pages branch, which GitHub Pages serves at
# https://octagator.github.io/wedding-invitaion/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /wedding-invitaion
          NEXT_PUBLIC_SITE_URL: https://octagator.github.io/wedding-invitaion
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Publish ./out to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
          commit_message: "Publish ${{ github.sha }}"
